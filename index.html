async function submitBadgeRequest(){if(!authUser||!supabaseClient){alert('Please sign in first.');return;}var type=document.getElementById('badgeRequestType').value,reason=(document.getElementById('badgeRequestReason').value||'').trim(),status=document.getElementById('badgeRequestStatus');if(status)status.textContent='Submitting…';var r=await supabaseClient.from('badge_requests').insert({user_id:authUser.id,requested_badge:type,reason:reason,status:'pending'});if(r.error){if(status)status.textContent=r.error.code==='23505'?'You already have a request with this status. Contact the admin if it was rejected.':r.error.message;return;}if(status)status.textContent='Request submitted. The Hell Camp admin must approve it.'}

async function saveBadgePricing(e){e.preventDefault();if(!authUser||!authProfile||authProfile.role!=='admin'){alert('Only the Hell Camp admin can set badge prices.');return;}var b=Number(document.getElementById('adminBlueBadgePrice').value||0),g=Number(document.getElementById('adminGoldBadgePrice').value||0),currency=document.getElementById('adminBadgeCurrency').value,status=document.getElementById('adminBadgePricingStatus');if(b<0||g<0||!Number.isFinite(b)||!Number.isFinite(g)){if(status)status.textContent='Enter valid non-negative prices.';return;}if(status)status.textContent='Saving prices…';var r=await supabaseClient.from('badge_pricing').upsert({id:1,blue_price:b,gold_price:g,currency:currency,updated_by:authUser.id,updated_at:new Date().toISOString()},{onConflict:'id'});if(r.error){if(status)status.textContent='Could not save: '+r.error.message;return;}if(status)status.textContent='Badge prices saved.';await loadBadgePricing();}

async function loadAuthProfile(){if(!supabaseClient||!authUser)return;var profileUser=authUser,appRole=profileUser.app_metadata&&profileUser.app_metadata.role==='admin'?'admin':'client',fallback={id:profileUser.id,role:appRole,display_name:profileUser.user_metadata&&profileUser.user_metadata.display_name||profileUser.email.split('@')[0]};var r=await supabaseClient.from('profiles').select('id,display_name,email,role,credits,daily_credits,paid_coins,subscription_plan,subscription_expires_at,is_verified,avatar_path,cover_path,bio,location,country,currency,badge_type,badge_status').eq('id',profileUser.id).maybeSingle();if(!authUser||authUser.id!==profileUser.id)return;if(r.error){console.warn('Profile lookup:',r.error.message);authProfile=fallback;return;}var metaCountry=(profileUser.user_metadata&&profileUser.user_metadata.country)||'',metaCurrency=(profileUser.user_metadata&&profileUser.user_metadata.currency)||currencyForCountry(metaCountry);authProfile=Object.assign({},fallback,{country:metaCountry,currency:metaCurrency,badge_type:null,badge_status:'none'},r.data||{},{role:appRole});if(!authProfile.country&&metaCountry)authProfile.country=metaCountry;if(metaCountry&&(!r.data||!r.data.country))authProfile.currency=metaCurrency;else authProfile.currency=authProfile.currency||metaCurrency;if(r.data&&metaCountry&&!r.data.country){var countrySync=await supabaseClient.from('profiles').update({country:metaCountry,currency:metaCurrency,updated_at:new Date().toISOString()}).eq('id',profileUser.id);if(!authUser||authUser.id!==profileUser.id)return;if(!countrySync.error){authProfile.country=metaCountry;authProfile.currency=metaCurrency}}if(!r.data){var ins=await supabaseClient.from('profiles').insert({id:profileUser.id,email:profileUser.email,display_name:authProfile.display_name,country:authProfile.country||null,currency:authProfile.currency||currencyForCountry(authProfile.country)}).select('id,display_name,email,role,credits,daily_credits,paid_coins,is_verified,avatar_path,bio,country,currency,badge_type,badge_status').maybeSingle();if(!authUser||authUser.id!==profileUser.id)return;if(!ins.error&&ins.data)authProfile=Object.assign({},fallback,ins.data,{role:appRole});else if(ins.error)console.warn('Profile row creation needs a signup trigger/policy:',ins.error.message);}}

k-result-card" style="display:block;margin:14px 0"><h3>3. Your result</h3><div class="hc-pink-result-placeholder"><span>✨</span><b>Your result will appear here</b><small>After generation completes</small></div></div><button id="hcHeadSubmit" class="btn primary" type="submit" style="width:100%;min-height:48px">'+(isFaceSwap?'Upload & swap face':'Upload & swap head')+'</button><p class="muted" style="font-size:12px">Uses Magic Hour API credits. Hell Camp does not deduct coins for this feature.</p></form></section></div>';

(function(){
  function applyTheme(preference, persist){
    var pref = ['light','dark','system'].indexOf(preference) >= 0 ? preference : 'system';
    var light = pref === 'light' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.body.classList.toggle('light', !!light);
    document.documentElement.style.colorScheme = light ? 'light' : 'dark';
    if (persist) { try { localStorage.setItem('hc_theme_preference', pref); } catch (e) {} }
  }
  window.hcApplyThemePreference = applyTheme;
  var saved = null;
  try { saved = localStorage.getItem('hc_theme_preference'); } catch (e) {}
  var initialSelect = document.getElementById('pref_theme');
  applyTheme(saved || (initialSelect && initialSelect.value) || 'system', false);
  /* Handle the visible theme toggle before older delegated handlers can conflict. */
  document.addEventListener('click', function(e){
    var target = e.target && e.target.closest ? e.target.closest('[data-action="theme"], [data-action="toggleTheme"], [data-theme-toggle]') : null;
    if (!target) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var next = document.body.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next, true);
    var select = document.getElementById('pref_theme');
    if (select) select.value = next;
  }, true);
  document.addEventListener('change', function(e){
    if (e.target && e.target.id === 'pref_theme') applyTheme(e.target.value, true);
  });
  document.addEventListener('submit', function(e){
    if (e.target && e.target.id === 'memberSettingsForm') {
      var select = document.getElementById('pref_theme');
      if (select) applyTheme(select.value, true);
    }
  }, true);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    var syncSystemTheme = function(){
      var pref = 'system';
      var select = document.getElementById('pref_theme');
      try { pref = localStorage.getItem('hc_theme_preference') || (select && select.value) || 'system'; } catch (e) {}
      if (pref === 'system') applyTheme('system', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', syncSystemTheme);
    else if (mq.addListener) mq.addListener(syncSystemTheme);
  }
})();

<script id="hc-runtime-recovery">
(function(){
  'use strict';
  function showRecovery(message){
    var view=document.getElementById('view');
    if(!view)return;
    if(view.innerHTML&&view.innerHTML.trim()&&view.textContent.trim())return;
    view.innerHTML='<section style="margin:18px 0;padding:20px;border:1px solid #a78bfa;border-radius:18px;background:var(--panel,#fff);color:var(--text,#222)"><h2 style="margin-top:0">Hell Camp is recovering</h2><p>The page did not finish displaying. You can retry without losing your account.</p><p style="font-size:12px;opacity:.8;overflow-wrap:anywhere">'+String(message||'App startup did not complete').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})+'</p><button type="button" id="hcRecoveryRetry" style="padding:12px 18px;border:0;border-radius:12px;background:#8b5cf6;color:white;font-weight:700">Reload Hell Camp</button></section>';
    var b=document.getElementById('hcRecoveryRetry');
    if(b)b.onclick=function(){location.reload()};
  }
  window.addEventListener('error',function(e){console.error('Hell Camp runtime error:',e.message,e.filename,e.lineno);setTimeout(function(){var v=document.getElementById('view');if(v&&(!v.innerHTML.trim()||!v.textContent.trim()))showRecovery(e.message||'A script error stopped the page');},0);});
  window.addEventListener('unhandledrejection',function(e){console.error('Hell Camp startup error:',e.reason);setTimeout(function(){var v=document.getElementById('view');if(v&&(!v.innerHTML.trim()||!v.textContent.trim()))showRecovery(e.reason&&e.reason.message||'A startup request failed');},0);});
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('[data-page]'):null;
    if(!b)return;
    setTimeout(function(){
      var v=document.getElementById('view');
      if(v&&(!v.innerHTML.trim()||!v.textContent.trim())){
        var page=b.getAttribute('data-page')||'Home';
        showRecovery('Navigation to "'+page+'" did not render content. Reload Hell Camp to recover, then report this page if the problem continues.');
      }
    },250);
  },true);
  window.addEventListener('load',function(){
    setTimeout(function(){
      var v=document.getElementById('view');
      if(v&&(!v.innerHTML.trim()||!v.textContent.trim()))showRecovery('The app shell loaded, but its main content stayed empty. Try reloading after the update.');
    },5000);
  });
})();
</script>

<script id="hc-pwa-install-helper">
(function(){
 let deferredPrompt=null;
 function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
 function setup(){
  if(isStandalone())return;
  let btn=document.getElementById('hcInstallAppButton');
  if(!btn){btn=document.createElement('button');btn.id='hcInstallAppButton';btn.type='button';btn.textContent='⬇ Install Hell Camp';btn.setAttribute('aria-label','Install Hell Camp app');document.body.appendChild(btn)}
  btn.classList.add('hc-install-visible');
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;btn.textContent='⬇ Install Hell Camp';btn.classList.add('hc-install-visible')});
  window.addEventListener('appinstalled',function(){deferredPrompt=null;btn.classList.remove('hc-install-visible')});
  btn.addEventListener('click',async function(){
   if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice}catch(e){}deferredPrompt=null;return}
   const ua=navigator.userAgent||'';
   if(/iPhone|iPad|iPod/i.test(ua)){alert('To add Hell Camp on iPhone: open this page in Safari, tap Share, then choose Add to Home Screen.');return}
   if(/Android/i.test(ua)){alert('To install Hell Camp: open this site in Chrome, tap the ⋮ menu, then choose Install app or Add to Home screen. If that option is missing, reload the site once and try again.');return}
   alert('Open the browser menu and choose Install app or Add to Home screen, if available.');
  });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',setup);else setup();
})();
</script>

<script id="hc-ai-job-import-ui">
(function(){
 const fn='job-channel-import';
 function escHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
 function host(id){return document.getElementById(id)}
 function showResult(message,ok){var h=host('hcJobImportResult');if(h)h.innerHTML='<div class="'+(ok?'notice':'notice')+'" style="background:'+(ok?'rgba(34,197,94,.12)':'rgba(245,158,11,.12)')+';border-color:'+(ok?'rgba(34,197,94,.45)':'rgba(245,158,11,.4)')+';color:var(--text)">'+escHtml(message)+'</div>'}
 async function call(body){if(!window.supabaseClient)throw new Error('Hell Camp database is not ready. Refresh and try again.');var r=await supabaseClient.functions.invoke(fn,{body:body});if(r.error)throw new Error((r.data&&r.data.error)||r.error.message||'The job import service could not be reached.');if(r.data&&r.data.error)throw new Error(r.data.error);return r.data||{}}
 window.loadJobImportStatus=async function(){
  if(!host('hcJobChannelUrl')||!window.supabaseClient||!window.authUser||!window.authProfile||authProfile.role!=='admin')return;
  try{var d=await call({action:'status'});var input=host('hcJobChannelUrl');if(input&&d.setting&&d.setting.source_channel_url)input.value=d.setting.source_channel_url;var st=host('hcJobSourceStatus');if(st)st.textContent=d.setting&&d.setting.enabled?'Channel link saved. Copy/forward a job update below to run AI screening.':'Add and save the WhatsApp Channel link to get started.';var hist=host('hcJobImportHistory');if(hist){var rows=d.recent||[];hist.innerHTML=rows.length?rows.map(function(x){var j=x.parsed_job||{};return '<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>'+escHtml(j.title||'Job import')+'</b><div class="muted tiny">'+escHtml(x.status)+' · '+escHtml(new Date(x.created_at).toLocaleString())+'</div>'+(x.reason?'<div class="muted tiny">'+escHtml(x.reason)+'</div>':'')+'</div>'}).join(''):'<p class="muted tiny">No jobs imported yet.</p>'}}
  catch(e){var st=host('hcJobSourceStatus');if(st)st.textContent=e.message||'Could not load job import settings.'}
 };
 document.addEventListener('click',async function(e){
  var save=e.target&&e.target.closest?e.target.closest('#hcJobSaveSource'):null;
  var submit=e.target&&e.target.closest?e.target.closest('#hcJobImportSubmit'):null;
  if(!save&&!submit)return;
  e.preventDefault();
  if(!window.authUser||!window.authProfile||authProfile.role!=='admin'){showResult('Only the Hell Camp administrator can use this importer.',false);return}
  if(save){
   save.disabled=true;save.textContent='Saving…';
   try{var url=(host('hcJobChannelUrl').value||'').trim();var d=await call({action:'configure',source_channel_url:url});var st=host('hcJobSourceStatus');if(st)st.textContent=d.enabled?'Channel link saved. Paste each job update below.':'Channel link cleared.';showResult(d.note||'Source settings saved.',true)}
   catch(err){showResult(err.message||'Could not save source settings.',false)}
   finally{save.disabled=false;save.textContent='Save Channel link'}
   return;
  }
  var raw=(host('hcJobRawMessage').value||'').trim();
  if(raw.length<50){showResult('Paste the complete job update first (at least 50 characters).',false);return}
  submit.disabled=true;submit.textContent='AI is checking the job…';showResult('Checking the employer details, application method, scam signals and duplicates. This can take a moment.',true);
  try{var d=await call({action:'ingest',raw_message:raw,source_channel_url:(host('hcJobChannelUrl').value||'').trim()});if(d.duplicate){showResult(d.message||'This update has already been processed.',true)}else if(d.status==='published'){var j=d.job||{};showResult('Published to Hell Camp Jobs: '+(j.title||'Job')+' at '+(j.company||'the listed employer')+'. Please still verify the employer before applying.',true);host('hcJobRawMessage').value='';await loadJobImportStatus();if(typeof loadPublicContent==='function')loadPublicContent('job')}else{showResult(d.reason||d.message||'This job did not pass automatic publishing checks.',false);await loadJobImportStatus()}}
  catch(err){showResult(err.message||'Job import failed. Try again.',false)}
  finally{submit.disabled=false;submit.textContent='🤖 Validate & publish eligible job'}
 },true);
 document.addEventListener('click',function(e){var p=e.target&&e.target.closest?e.target.closest('[data-page]'):null;if(p&&p.getAttribute('data-page')==='Jobs')setTimeout(function(){if(typeof window.loadJobImportStatus==='function')window.loadJobImportStatus()},250)});
document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshUnreadNotificationDot();});setInterval(refreshUnreadNotificationDot,30000);
})();
</script>
