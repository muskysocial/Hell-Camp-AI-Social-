rder-radius:10px;color:var(--muted)}.switcher button.active{background:#3b1c5d;color:white}.notice{padding:13px;border:1px solid #44305f;background:#1b1230;border-radius:12px;color:#e6ceff;font-size:13px;margin:12px 0}.bottomnav{display:none}.hidden{display:none!important}.empty{text-align:center;padding:35px 12px;color:var(--muted)}.menu-section{font-size:11px;letter-spacing:1.5px;color:var(--muted);margin:20px 12px 8px}.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 0,#301347,transparent 55%)}.login-card{width:min(100%,430px);padding:27px;border:1px solid #35264b;border-radius:24px;background:#0a101cf5}.login-card h1{margin:12px 0 4px;font-size:27px}.login-logo{text-align:center;margin-bottom:20px}.fine{font-size:12px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:205px minmax(0,1fr)}.rightside{display:none}}@media(max-width:680px){.top{height:61px;padding:0 13px}.brand{font-size:23px}.search.topsearch{min-width:0;width:min(43vw,190px)}.top-actions{gap:6px}.top-actions .hide-mobile{display:none}.layout{display:block;padding:13px 12px 92px}.leftside{display:none}.page-head h1{font-size:23px}.quick-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.quick{padding:10px 7px;min-height:95px}.quick strong{font-size:11px}.quick span{font-size:10px}.quick .qico{width:30px;height:30px}.post-art{min-height:220px}.bottomnav{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;padding:8px 7px calc(8px + env(safe-area-inset-bottom));background:#070b14f5;border-top:1px solid #28364b;justify-content:space-around;backdrop-filter:blur(18px)}.bottomnav button{display:grid;justify-items:center;gap:3px;border:0;background:transparent;color:#aab5ca;font-size:10px;min-width:45px}.bottomnav button.active{color:#d65cff}.bottomnav .plus{width:43px;height:43px;border-radius:50%;background:linear-gradient(135deg,#8e39ed,#d43fd8);font-size:24px;color:white;place-items:center;marg </style></head><body><div id="root"></div><script>
const state={page:'Home',marketTab:'Marketplace',auth:false,loginMode:'login',dark:true,likes:{},saved:{},following:{},messages:[{name:'Hell Camp AI',text:'Welcome to Hell Camp! I’m your AI companion. Ask me for ideas, captions, or help planning your next creation.',mine:false}],chatCount:3,products:[['📱','iPhone 14 Pro Max','₦950,000','Electronics'],['👟','Nike Air Force 1','₦85,000','Fashion'],['💻','MacBook Air M2','₦620,000','Electronics'],['👜','Designer handbag','₦120,000','Fashion'],['🏡','Land for sale','₦15,000,000','Property'],['🛏️','Room for rent','₦250,000/month','Property']],posts:[{user:'Lily Rose',handle:'@lily_rose',text:'Good vibes only! 💜 Life is better when you’re surrounded by the right people.',likes:2400,art:'A little reminder: keep growing into your best self ✨'}]};
const navItems=[['Home','⌂'],['My Profile','♙'],['Marketplace','▣'],['AI Chat','✦'],['AI Educational Studio','▤'],['AI Head Swap','◉'],['AI Voice','♫'],['Messages','▱'],['Notifications','♧'],['Groups','♧'],['Events','▦'],['Saved','♡'],['Memories','◷'],['Creator Studio','▣'],['Ads Center','◈'],['Premium Service','♛'],['Settings & Privacy','⚙'],['Help & Support','?'],['ADMINhub','♜']];
function btn(label,action,cls='btn'){return '<button class="'+cls+'" onclick="'+action+'">'+label+'</button>'}
function go(page){state.page=page;render();window.scrollTo({top:0,behavior:'smooth'})}
function toggleLike(i){state.likes[i]=!state.likes[i];render()}
function render(){const root=document.getElementById('root');if(!state.auth){root.innerHTML=login();return}root.innerHTML='<div class="app">'+header()+'<div class="layout">'+sidebar()+'<main class="content">'+pageContent()+'</main>'+rightbar()+'</div>'+bottomnav()+'</div>';bindForms()}
function header(){return '<header class="top"><div class="brand">Hell <span>Camp</span></div><div class="top-actions"><label class="search topsearch"><span>⌕</span><input id="globalSearch" placeholder="Search Hell Camp..." onkeydown="if(event.key===\'Enter\')searchAll(this.value)"></label><button class="iconbtn hide-mobile" aria-label="Create post" onclick="go(\'Create Post\')">＋</button><button class="iconbtn" aria-label="Notifications" onclick="go(\'Notifications\')">♧</button><button class="avatarbtn" onclick="go(\'My Profile\')">EC</button></div></header>'}
function sidebar(){return '<aside class="side leftside"><div class="nav">'+navItems.slice(0,8).map(([n,i])=>'<button class="'+(state.page===n?'active':'')+'" onclick="go(\''+n+'\')"><span class="ico">'+i+'</span>'+n+(n==='Messages'?'<small>3</small>':'')+'</button>').join('')+'</div><div class="menu-section">YOUR SPACE</div><div class="nav">'+navItems.slice(8).map(([n,i])=>'<button class="'+(state.page===n?'active':'')+'" onclick="go(\''+n+'\')"><span class="ico">'+i+'</span>'+n+'</button>').join('')+'</div><div class="sidecard"><div class="eyebrow">Hell Camp Premium</div><h3>Make more. Go further.</h3><p class="muted" style="font-size:12px">Explore creative tools and unlock your workflow.</p>'+btn('Explore plans',"go('Premium Service')",'btn full')+'</div></aside>'}
function rightbar(){return '<aside class="side rightside"><div class="sidecard"><div class="right-title">Active now <span style="color:#53e49c">●</span></div><div class="online-list">'+[['Lily Rose','LR'],['David King','DK'],['Sarah Official','SO'],['Treasure','T']].map(x=>'<div class="online-person"><div class="person">'+x[1]+'</div><span class="dot"></span><div><strong>'+x[0]+'</strong><div class="muted" style="font-size:11px">Online</div></div></div>').join('')+'</div></div><div class="sidecard"><div class="right-title">Trending on Hell Camp</div><p>✦ #CreatorLife</p><p>✦ #DailyInspiration</p><p>✦ #MadeInNigeria</p>'+btn('Explore trends',"go('Discover')",'btn ghost full')+'</div><p class="fine" style="padding:8px">About · Privacy · Terms · Help<br><br>© 2026 Hell Camp</p></aside>'}
function bottomnav(){return '<nav class="bottomnav">'+[['Home','⌂'],['Marketplace','▣'],['Create Post','＋'],['Messages','▱'],['My Profile','♙']].map(([n,i])=>'<button class="'+(n==='Create Post'?'plus':state.page===n?'active':'')+'" onclick="go(\''+n+'\')"><span style="font-size:'+(n==='Create Post'?'28':'21')+'px">'+i+'</span>'+(n==='Create Post'?'':n)+'</button>').join('')+'</nav>'}
function pageHead(title,sub='',right=''){return '<div class="page-head"><div><h1>'+title+'</h1>'+(sub?'<div class="muted" style="font-size:13px;margin-top:3px">'+sub+'</div>':'')+'</div>'+right+'</div>'}
function stories(){return '<div class="stories">'+[['＋','Your story'],['🎧','official_hc'],['🌸','lily_rose'],['🧑🏽','king_david'],['🌴','treasure'],['✨','sarah']].map((x,i)=>'<div class="story" onclick="go(\'Status\')"><div class="ring"><div>'+x[0]+'</div></div>'+x[1]+'</div>').join('')+'</div>'}
function postCard(p,i){return '<article class="card post"><div class="post-head"><div class="person">'+p.user.split(' ').map(x=>x[0]).join('')+'</div><div class="meta"><strong>'+p.user+' <span style="color:#c66cff">✦</span></strong><span class="muted" style="font-size:12px">'+(p.handle||'@creator')+' · 2h · 🌐</span></div><button class="iconbtn" onclick="alert(\'Post options are a demo in this preview.\')">···</button></div><p class="post-copy">'+p.text+'</p><div class="post-art"><div>'+p.art+'</div></div><div class="post-actions"><button onclick="toggleLike('+i+')">'+(state.likes[i]?'💜':'♡')+' '+(p.likes||0+(state.likes[i]?1:0))+'</button><button onclick="commentPost()">♧ Comment</button><button onclick="alert(\'Share preview\')">↗ Share</button><button style="margin-left:auto" onclick="state.saved['+i+']=!state.saved['+i+'];alert(state.saved['+i+']?'Saved':'Removed from saved')">'+(state.saved[i]?'🔖':'♧ Save')+'</button></div></article>'}
function home(){return stories()+'<div class="card composer"><div class="person">EC</div><input placeholder="What’s on your mind?" onclick="go(\'Create Post\')" readonly><button class="iconbtn" onclick="go(\'Create Post\')">▧</button></div><div class="quick-grid">'+[['▣','Marketplace','Buy & sell','Marketplace'],['▤','My Posts','Your content','My Profile'],['♧','Groups','Join & connect','Groups'],['▦','Events','What’s happening','Events']].map(x=>'<button class="quick" onclick="go(\''+x[3]+'\')"><div class="qico">'+x[0]+'</div><strong>'+x[1]+'</strong><span>'+x[2]+'</span></button>').join('')+'</div>'+state.posts.map(postCard).join('')}
function profile(){return '<section class="profile-cover"><div class="profile-top"><div class="big-person">EC</div><div><h2 style="margin:0">Ekechi Chisom ✦</h2><div class="muted">@chisom_eke</div><div style="margin-top:8px">Creative mind | Digital Creator | Business</div></div></div><div class="stats"><div><strong>245</strong><span class="muted">Posts</span></div><div><strong>12.5K</strong><span class="muted">Followers</span></div><div><strong>1.2K</strong><span class="muted">Following</span></div></div><p>Dream big · Build bigger 💜<br><span style="color:#d77bff">↗ hellcamp.social</span></p><div style="display:flex;gap:8px">'+btn('Edit Profile',"alert('Profile editing will connect in the next phase.')",'btn secondary')+btn('Share Profile',"alert('Profile link copied in a future connected build.')",'btn')+'</div></section><div class="stories">'+[['🌅','Highlights'],['✈️','Travel'],['🎨','Lifestyle'],['💼','Business'],['♧','Friends']].map(x=>'<div class="story" onclick="go(\'Highlights\')"><div class="ring"><div>'+x[0]+'</div></div>'+x[1]+'</div>').join('')+'</div><div class="tabs"><button class="active">▦ Posts</button><button onclick="go(\'Saved\')">▧ Saved</button><button onclick="go(\'Memories\')">◷ Memories</button></div><div class="feature-grid"><div class="post-art" style="min-height:160px">🌇</div><div class="post-art" style="min-height:160px">✨</div><div class="post-art" style="min-height:160px">🌴</div><div class="post-art" style="min-height:160px">💜</div></div>'}
function marketplace(){return '<div class="market-hero"><div class="eyebrow">Buy · Sell · Trade</div><h2>Marketplace</h2><p class="muted">Find amazing deals near you.</p>'+btn('＋ Post an item',"alert('Marketplace listing form will connect later.')")+'</div><div class="switcher"><button class="'+(state.marketTab==='Marketplace'?'active':'')+'" onclick="state.marketTab='Marketplace';render()">Marketplace</button><button class="'+(state.marketTab==='Gifts'?'active':'')+'" onclick="state.marketTab='Gifts';render()">🎁 Gifts</button></div>'+(state.marketTab==='Gifts'?'<div class="feature-grid">'+[['💐','Send flowers'],['🎁','Surprise gift'],['💎','Premium gift'],['💌','Love note']].map(x=>'<div class="card feature"><div class="ficon">'+x[0]+'</div><h3>'+x[1]+'</h3><p>Make someone’s day.</p>'+btn('Choose gift',"alert('Gift sending will activate when connected.')",'btn secondary full')+'</div>').join('')+'</div>':'<div class="tabs">'+['For You','Electronics','Fashion','Property'].map(t=>'<button class="'+(state.marketTab===t?'active':'')+'" onclick="state.marketTab=\''+t+'\';render()">'+t+'</button>').join('')+'</div><div class="product-grid">'+state.products.filter(p=>['Marketplace','For You'].includes(state.marketTab)||p[3]===state.marketTab).map(p=>'<article class="card product"><div class="product-img">'+p[0]+'</div><div class="product-body"><strong>'+p[1]+'</strong><div class="price">'+p[2]+'</div><div class="muted" style="font-size:11px;margin:5px 0">⌖ Lagos, Nigeria</div>'+btn('View item',"alert('Product details and checkout will be connected later.')",'btn secondary full')+'</div></article>').join('')+'</div>')}
function aiChat(){return pageHead('AI Chat','Your creative companion')+'<div class="notice">Demo mode · AI responses are simulated until an AI provider is connected.</div><div class="chatbox" id="chatbox">'+state.messages.map(m=>'<div class="bubble '+(m.mine?'mine':'')+'"><strong style="font-size:11px;display:block;margin-bottom:3px">'+(m.mine?'You':'Hell Camp AI')+'</strong>'+escapeHtml(m.text)+'</div>').join('')+'</div><form class="chat-input" id="chatForm"><input name="message" placeholder="Ask anything..." required autocomplete="off"><button class="btn">Send ↗</button></form><div class="tabs">'+['Write a caption','Explain a topic','Brainstorm ideas'].map(t=>'<button onclick="quickPrompt(\''+t+'\')">'+t+'</button>').join('')+'</div>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function features(title,desc,items){return pageHead(title,desc)+'<div class="notice">Preview mode: this interface is ready to connect to secure backend services. No real AI processing or charges happen yet.</div><div class="feature-grid">'+items.map(x=>'<div class="card feature"><div class="ficon">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p>'+btn(x[3]||'Open tool',"alert('This tool will be connected in the integration phase.')",'btn secondary full')+'</div>').join('')+'</div>'}
function createPost(){return pageHead('Create Post','Share a moment with your community',btn('← Back',"go('Home')",'btn ghost'))+'<div class="card"><div class="post-head"><div class="person">EC</div><div><strong>Ekechi Chisom</strong><div class="muted" style="font-size:12px">Posting to your profile · Public</div></div></div><form id="postForm"><div class="field"><textarea name="postText" rows="4" placeholder="What’s on your mind?" required></textarea></div><div class="feature-grid"><button type="button" class="btn secondary" onclick="alert('Photo picker will be enabled in the connected version.')">▧ Photo</button><button type="button" class="btn secondary" onclick="alert('Video picker will be enabled in the connected version.')">▣ Video</button></div><div class="field"><label><input type="checkbox" name="alsoMarket"> Also share to Marketplace (optional)</label></div><button class="btn full">Publish preview post</button></form></div>'}
function messages(){return pageHead('Messages','Stay close to your people',btn('＋ New Message',"alert('New conversation will connect later.')",'btn'))+'<div class="card"><div class="field"><input placeholder="⌕ Search chats..."></div>'+[['Lily Rose','Hey, how are you doing? 😊','9:12 AM'],['Official Hell Camp','Welcome to Hell Camp! 💜','8:45 AM'],['David King','Sent a photo','Yesterday'],['Chinara Beauty','Are you still selling the sneakers?','Yesterday'],['Jay Money','Let’s catch up soon 💯','Sunday']].map(x=>'<div class="online-person" style="padding:12px 0;border-bottom:1px solid var(--line)"><div class="person">'+x[0].split(' ').map(v=>v[0]).join('')+'</div><div style="flex:1"><strong>'+x[0]+'</strong><div class="muted" style="font-size:12px">'+x[1]+'</div></div><span class="muted" style="font-size:11px">'+x[2]+'</span></div>').join('')+'</div>'}
function admin(){return pageHead('ADMINhub','Administration workspace · restricted demo')+'<div class="notice">🔒 Admin-only area preview. Real role verification, audit logs, and server-side permissions must be configured before launch. This screen does not grant admin privileges.</div><div class="feature-grid">'+[['📊','Overview','Platform activity and health'],['♙','User management','Accounts, roles and reports'],['🛡️','Safety & moderation','Review reports and flagged content'],['💳','Payments & premium','Plans, transactions and refunds'],['🪙','Credits & AI usage','Usage controls and limits'],['⚙️','Platform settings','Feature flags and configuration'],['🔔','Notifications','System announcements'],['📜','Audit log','Track privileged actions']].map(x=>'<div class="card feature"><div class="ficon">'+x[0]+'</div><h3>'+x[1]+'</h3><p>'+x[2]+'</p>'+btn('Open section',"alert('Secure backend and admin permissions required.')",'btn secondary full')+'</div>').join('')+'</div>'}
function pageContent(){switch(state.page){case'Home':return pageHead('Your world, your way','Welcome back, Ekechi')+home();case'My Profile':return pageHead('My Profile','Your story, all in one place',btn('⚙',"go('Settings & Privacy')",'btn ghost'))+profile();case'Marketplace':return marketplace();case'Create Post':return createPost();case'Messages':return messages();case'AI Chat':return aiChat();case'AI Educational Studio':return features('AI Educational Studio','Learn, design and create',['📚','🧠'].slice(0,1).map(x=>[x,'Study assistant','Turn topics into simple lessons and learning plans.','Start learning']).concat([['🎨','Design workspace','Create educational visuals and study materials.','Open studio'],['📝','Quiz maker','Generate practice questions when AI is connected.','Build a quiz']]));case'AI Head Swap':return features('AI Head Swap','Creative photo editing tools',[['🖼️','Choose photo','Upload a source image in the connected version.'],['✨','Head swap studio','Preview a guided AI face-swap workflow.']]);case'AI Voice':return features('AI Voice','Voice tools for your content',[['🎙️','Text to speech','Turn text into natural-sounding voice when connected.'],['🌍','Voice styles','Explore language and style choices.'],['🎧','Voice library','Your saved voice projects.']]);case'Premium Service':return pageHead('Premium Service','Plans and benefits — payment not enabled yet')+'<div class="feature-grid">'+[['Free','Explore the community','Profile, feed and social basics'],['Creator','For everyday creators','More creative tools and workflows'],['Studio','For power creators','Expanded creative workspace']].map((x,i)=>'<div class="card feature"><div class="eyebrow">'+(i===0?'STARTER':i===1?'CREATOR':'ADVANCED')+'</div><h3>'+x[0]+'</h3><p>'+x[1]+'</p><p>'+x[2]+'</p>'+btn('View plan',"alert('Subscriptions and payment gateway will be connected later.')",'btn full')+'</div>').join('')+'</div>';case'ADMINhub':return admin();case'Notifications':return pageHead('Notifications','Updates and activity')+'<div class="card">'+[['♡','Lily Rose liked your post','2 min ago'],['♧','David King started following you','1 hour ago'],['✦','Welcome to Hell Camp','Today']].map(x=>'<div class="online-person" style="padding:14px 0;border-bottom:1px solid var(--line)"><div class="person">'+x[0]+'</div><div><strong>'+x[1]+'</strong><div class="muted" style="font-size:12px">'+x[2]+'</div></div></div>').join('')+'</div>';case'Settings & Privacy':return features('Settings & Privacy','Control your account and visibility',[['♙','Account','Profile and account details'],['🔐','Security','Password, sessions and two-step verification'],['◉','Privacy','Online status, audience and blocking'],['🔔','Notifications','Choose which updates you receive'],['☾','Appearance','Theme and display preferences']]);case'Groups':return features('Groups','Find your community',[['♧','Discover groups','Explore communities by interest'],['＋','Create a group','Bring people together']]);case'Events':return features('Events','What’s happening around you',[['▦','Discover events','Find meetups and live events'],['＋','Create event','Invite your community']]);case'Saved':return pageHead('Saved','Posts and items you kept')+'<div class="empty">🔖<h3>Your saved space</h3><p>Posts and marketplace items you save will appear here.</p></div>';case'Memories':return pageHead('Memories','Moments worth revisiting')+'<div class="empty">◷<h3>Your memories begin here</h3><p>Come back to revisit moments from your journey.</p></div>';case'Creator Studio':return features('Creator Studio','Tools for growing your audience',[['📈','Insights','Reach, engagement and content performance'],['✍️','Content planner','Organize upcoming posts'],['🎬','Media library','Manage your creative assets']]);case'Ads Center':return features('Ads Center','Promote content and reach your audience',[['📣','Campaigns','Create and manage campaigns'],['📊','Ad insights','Measure performance']]);case'Help & Support':return pageHead('Help & Support','We’re here to help')+'<div class="card"><h3>How can we help?</h3><div class="field"><input placeholder="Search help articles"></div>'+btn('Contact support',"alert('Support contact will be configured before launch.')")+'</div>';case'Status':return features('Status','Share a moment that disappears later',[['＋','Add status','Photo, video or text status']]);case'Discover':return features('Discover','Find people and topics',[['♧','People to follow','Discover new creators'],['#','Trending topics','See what people are talking about']]);default:return pageHead(state.page,'This section is a preview')+'<div class="card empty"><h3>'+state.page+'</h3><p>This section is part of the Hell Camp prototype and will be connected during the integration phase.</p>'+btn('Back to Home',"go('Home')")+'</div>'}}
function login(){return '<main class="login-wrap"><section class="login-card"><div class="login-logo"><div class="brand">Hell <span>Camp</span></div><p class="muted">Your people. Your creativity. Your world.</p></div><div class="switcher"><button class="'+(state.loginMode==='login'?'active':'')+'" onclick="state.loginMode=\'login\';render()">Log in</button><button class="'+(state.loginMode==='signup'?'active':'')+'" onclick="state.loginMode=\'signup\';render()">Create account</button></div><h1>'+(state.loginMode==='login'?'Welcome back':'Join Hell Camp')+'</h1><p class="muted">Connect, create and discover something new.</p><form id="authForm">'+(state.loginMode==='signup'?'<div class="field"><label>Full name</label><input name="name" placeholder="Your name" required></div>':'')+'<div class="field"><label>Email address</label><input type="email" name="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input type="password" name="password" placeholder="At least 8 characters" minlength="8" required></div>'+(state.loginMode==='login'?'<div style="text-align:right"><button type="button" class="fine" style="background:none;border:0" onclick="state.loginMode=\'forgot\';render()">Forgot password?</button></div>':'')+'<button class="btn full" style="margin-top:15px">'+(state.loginMode==='signup'?'Create account':'Log in')+'</button></form><div style="display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px"><span style="height:1px;background:var(--line);flex:1"></span>OR CONTINUE WITH<span style="height:1px;background:var(--line);flex:1"></span></div>'+btn('◉  Continue with Google',"alert('Google sign-in will work after OAuth setup.')",'btn secondary full')+'<p class="fine" style="text-align:center;margin-top:18px">Preview account only. Authentication is not connected yet.<br>By continuing, you agree to our Terms and Privacy Policy.</p></section></main>'}
function bindForms(){let a=document.getElementById('authForm');if(a)a.onsubmit=e=>{e.preventDefault();if(state.loginMode==='forgot'){alert('Password reset will be available after authentication is connected.');return}state.auth=true;render()};let c=document.getElementById('chatForm');if(c)c.onsubmit=e=>{e.preventDefault();let f=new FormData(c),m=f.get('message').trim();if(!m)return;state.messages.push({name:'You',text:m,mine:true},{name:'Hell Camp AI',text:'Thanks for asking! This is a UI preview. Connect an AI provider to enable real answers. I can already show where your assistant conversation will live.',mine:false});render();let box=document.getElementById('chatbox');if(box)box.scrollTop=box.scrollHeight};let p=document.getElementById('postForm');if(p)p.onsubmit=e=>{e.preventDefault();let txt=new FormData(p).get('postText').trim();if(txt){state.posts.unshift({user:'Ekechi Chisom',handle:'@chisom_eke',text:txt,likes:0,art:'Your post is ready for media and publishing integration.'});go('Home');alert('Preview post added. It is not published to a server.')}}}
function commentPost(){alert('Comments will be stored when the backend is connected.')}
function quickPrompt(s){let f=document.querySelector('#chatForm input');if(f){f.value=s+': ';f.focus()}}
function searchAll(q){if(!q.trim())return;let n=navItems.find(x=>x[0].toLowerCase().includes(q.toLowerCase()));if(n)go(n[0]);else {go('Discover');alert('Search preview for: '+q)}}
render();
</script></body></html>
