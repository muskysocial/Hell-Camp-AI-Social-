<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11101a"><title>Hell Camp</title>
<style>
:root{--bg:#11101a;--panel:#1c1a28;--panel2:#292638;--text:#faf7ff;--muted:#b1abc1;--line:#393448;--accent:#b46aff;--pink:#ff70ae}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:235px minmax(0,1fr)}aside{position:sticky;top:0;height:100vh;background:#15131f;border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:5px}.brand{font-size:23px;font-weight:900;letter-spacing:-1px;padding:10px 9px 22px}.brand span{color:var(--pink)}.nav{background:none;border:0;text-align:left;color:var(--muted);border-radius:12px;padding:10px 12px}.nav.active,.nav:hover{background:#352746;color:white}.foot{margin-top:auto}.main{width:100%;max-width:960px;margin:auto;padding:22px 26px 35px;min-width:0}.top{display:flex;align-items:center;gap:10px;margin-bottom:23px}.search{width:100%;max-width:470px;margin-right:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px 13px}.btn{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 13px}.primary{background:linear-gradient(120deg,#9358e9,#e85da9);border:0;font-weight:750}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#9557e8,#ff6da9);display:inline-grid;place-items:center;font-weight:800;flex-shrink:0}.title{font-size:28px;letter-spacing:-.8px;line-height:1.2;margin:0 0 6px}.muted{color:var(--muted)}.sub{margin:0 0 20px;color:var(--muted)}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:14px}.row{display:flex;align-items:center;gap:10px}.spread{justify-content:space-between}.tiny{font-size:12px}.stories{display:flex;gap:13px;overflow:auto;padding:4px 0 15px}.story{min-width:58px;text-align:center;font-size:12px;color:var(--muted)}.story .avatar{width:55px;height:55px;margin-bottom:5px;border:2px solid var(--pink)}.composer{display:flex;gap:9px;align-items:center}.composer input,.field{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%;min-width:0}.composer input{border-radius:25px}.postmedia{height:145px;border-radius:12px;background:linear-gradient(135deg,#3b285c,#a54e83,#e6a28f);display:grid;place-items:center;font-size:43px;margin:12px 0}.actions{display:flex;gap:5px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:9px}.actions button{background:none;border:0;color:var(--muted);flex:1;padding:7px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:linear-gradient(140deg,#28213a,#1c1a28);border:1px solid var(--line);border-radius:16px;padding:16px;min-height:135px;text-align:left}.tile .ico{font-size:27px}.tile h3{margin:7px 0 3px}.tile p{font-size:13px;color:var(--muted);margin:0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 17px}.tab{border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:8px 13px}.tab.active{background:#51356c;border-color:var(--accent)}.notice{padding:12px;border-radius:12px;background:#35291c;border:1px solid #69502e;color:#f3d6a4;font-size:13px;margin:13px 0}.chatlog{height:260px;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:8px 0 15px}.bubble{align-self:flex-start;max-width:86%;background:var(--panel2);padding:10px 13px;border-radius:14px}.bubble.me{align-self:flex-end;background:#5d3a7d}.chatform{display:flex;gap:8px}.cover{height:130px;background:linear-gradient(120deg,#46316d,#c75e9d,#efad98);border-radius:14px;margin-bottom:-38px}.profilehead{padding:0 14px 14px}.profilehead .avatar{width:75px;height:75px;border:4px solid var(--panel);font-size:23px}.mobile{display:none}.light{--bg:#f5f1fa;--panel:#fff;--panel2:#f0eaf6;--text:#241c2d;--muted:#746a80;--line:#e0d7e9;color-scheme:light}.light aside{background:#fff}.light .tile{background:#f5effa}@media(max-width:760px){.app{display:block}aside{display:none}.main{padding:13px 12px 88px}.title{font-size:25px}.top{margin-bottom:18px}.top .btn.desktop{display:none}.grid{gap:9px}.card{padding:13px}.mobile{display:flex;position:fixed;z-index:5;bottom:0;left:0;right:0;justify-content:space-around;background:rgba(20,18,30,.97);border-top:1px solid var(--line);padding:7px 2px calc(7px + env(safe-area-inset-bottom))}.mobile button{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center}.mobile b{font-size:19px}.light .mobile{background:rgba(255,255,255,.97)}}
/* Hell Camp visual rebuild — screenshot-inspired mobile-first social layout */
:root{--bg:#020810;--panel:#071321;--panel2:#101d2d;--text:#f8f7ff;--muted:#a5b0c4;--line:#24354a;--accent:#b44cff;--pink:#ff56b6}
body{background:radial-gradient(ellipse at 50% -15%,#20103b 0,transparent 42%),var(--bg);font-size:14px}
.app{grid-template-columns:225px minmax(0,1fr);max-width:1440px;margin:0 auto}
aside{background:#030a13;border-color:#1d2b40}
.brand{font-family:Georgia,serif;font-style:italic;font-size:25px;letter-spacing:-1.4px}.brand span{background:linear-gradient(90deg,#c35aff,#ff62b2);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{padding:12px;border:1px solid transparent;font-weight:600}.nav.active,.nav:hover{background:linear-gradient(100deg,#291345,#111a2b);border-color:#56317a}
.main{max-width:1040px;padding:20px 24px 40px}.top{position:sticky;top:0;z-index:4;padding:8px 0 13px;background:linear-gradient(var(--bg) 70%,transparent);backdrop-filter:blur(12px)}
.search{max-width:none;border-radius:24px;background:#101b2a}.btn{border-radius:12px}.primary{background:linear-gradient(120deg,#8e40f3,#df42c5);box-shadow:0 4px 18px #9b38e533}
.card{background:linear-gradient(145deg,#0b1726,#050d17);border-color:#23334a;border-radius:19px;box-shadow:0 8px 28px #0002}
.title{font-size:27px;font-weight:800;letter-spacing:-.7px}.sub{font-size:13px}
.stories{gap:15px;padding:8px 0 17px;scrollbar-width:none}.story{min-width:62px;color:#e0d9eb}.story .avatar{width:58px;height:58px;border:2px solid transparent;background:linear-gradient(#0b1726,#0b1726) padding-box,linear-gradient(135deg,#ff58b7,#9d4cff,#35d8e5) border-box}
.composer{border-radius:22px}.composer input{border-radius:30px;padding:12px 16px}
.postmedia{height:clamp(190px,38vw,430px);border:1px solid #29374a;background:radial-gradient(ellipse at 70% 15%,#69448c,#15243a 48%,#080e19);font-size:60px}
.actions{margin-top:9px}.actions button{color:#c5c8d5}
.grid{gap:11px}.tile{position:relative;overflow:hidden;background:linear-gradient(145deg,#172437,#080f1b);border-color:#2b3a51;border-radius:17px;min-height:120px;padding:14px;transition:transform .16s,border-color .16s}.tile:hover{transform:translateY(-2px);border-color:#a64de9}.tile .ico{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#a03df1,#ef4cae);font-size:21px}.tile h3{font-size:14px}.tile p{font-size:11px}
.tabs{gap:8px;overflow:auto;flex-wrap:nowrap;padding-bottom:3px}.tab{white-space:nowrap;border-radius:10px;background:#0e1a29}.tab.active{background:linear-gradient(120deg,#542b85,#302044);border-color:#b24cff}
.cover{background:radial-gradient(ellipse at 25% 35%,#bf58e8,transparent 35%),linear-gradient(120deg,#111c36,#38204d,#111827);height:150px}
.profilehead .avatar{background:linear-gradient(135deg,#a445ef,#f553b2);box-shadow:0 0 0 3px #10192a}
.chatlog{height:min(48vh,430px);min-height:220px}.bubble{border:1px solid #2a3850}.bubble.me{background:linear-gradient(120deg,#56268c,#862f88)}
.notice{border-radius:14px}
.light{--bg:#f5f1fa;--panel:#fff;--panel2:#f0eaf6;--text:#241c2d;--muted:#746a80;--line:#e0d7e9;color-scheme:light}
@media(min-width:761px){.main{padding-left:clamp(22px,4vw,54px);padding-right:clamp(22px,4vw,54px)}.stories{max-width:100%;}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){body{font-size:13px}.app{display:block}.main{padding:8px 12px calc(86px + env(safe-area-inset-bottom));max-width:560px}.top{gap:7px;margin-bottom:10px}.top .search{font-size:12px;padding:10px 13px}.top .btn{padding:8px 10px}.title{font-size:23px}.sub{margin-bottom:13px}.card{margin-bottom:11px;padding:12px}.stories{margin-left:-1px;margin-right:-1px;gap:12px}.story{min-width:58px;font-size:10px}.story .avatar{width:54px;height:54px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{min-height:103px;padding:11px}.tile .ico{width:34px;height:34px;font-size:18px}.tile h3{font-size:12px;margin:6px 0 2px}.tile p{font-size:10px}.postmedia{height:clamp(220px,72vw,380px);margin:10px 0}.mobile{background:rgba(3,9,17,.96);border-color:#29384d;backdrop-filter:blur(18px);padding:8px 2px calc(8px + env(safe-area-inset-bottom))}.mobile button{font-size:10px;min-width:0;flex:1}.mobile b{font-size:20px;color:#d4a1ff}.light .mobile{background:rgba(255,255,255,.96)}.profilehead .avatar{width:68px;height:68px}.cover{height:120px}.chatlog{height:48vh;min-height:250px}.chatform .field{font-size:13px}}
@media(max-width:370px){.main{padding-left:9px;padding-right:9px}.top .btn{padding:7px}.story{min-width:53px}.story .avatar{width:49px;height:49px}.actions button{font-size:11px;padding:6px 2px}}
</style></head><body><div class="app"><aside><div class="brand">HELL <span>CAMP</span></div><button class="nav active" data-page="Home">🏠　Home feed</button><button class="nav" data-page="Discover">✨　Discover</button><button class="nav" data-page="Messages">💬　Messages</button><button class="nav" data-page="Marketplace">🛍️　Marketplace & Gifts</button><button class="nav" data-page="AI Studio">✦　AI Studio</button><button class="nav" data-page="Profile">👤　My profile</button><button class="nav" data-page="Premium">💎　Premium</button><button class="nav" data-page="Groups">👥　Groups & Events</button><button class="nav" data-page="Creator Studio">🎬　Creator Studio</button><button class="nav" data-page="Settings">⚙️　Settings & Privacy</button><div class="foot"><button class="nav" data-page="ADMINhub">🛡️　ADMINhub</button><button class="nav" data-page="Help & Support">❔　Help & Support</button></div></aside><main class="main"><header class="top"><input id="search" class="search" placeholder="⌕ Search Hell Camp"><button class="btn desktop" data-action="theme">☼ Theme</button><button class="btn" data-page="Notifications">🔔</button><button class="btn" data-page="Profile">👤</button></header><div id="view"></div></main></div><nav class="mobile"><button data-page="Home"><b>⌂</b>Home</button><button data-page="Discover"><b>✧</b>Discover</button><button data-page="Messages"><b>▤</b>Chat</button><button data-page="Marketplace"><b>♧</b>Market</button><button data-page="Profile"><b>◉</b>Profile</button></nav>
<script>
(function(){
'use strict';
var view=document.getElementById('view');
var state={page:'Home',market:'Marketplace',posts:[{name:'Mira James',text:'Creating something beautiful today ✨ Who else is building their dreams?',tag:'#HellCamp #Creators',emoji:'🎨',likes:24},{name:'Jay K',text:'A little reminder: keep showing up for yourself.',tag:'#DailyMotivation',emoji:'🌅',likes:18}],liked:{},saved:{},following:false,name:'Your Name',messages:[{who:'AI Guide',text:'Welcome to Hell Camp! What would you like to explore today?'}]};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function heading(a,b){return '<h1 class="title">'+a+'</h1><p class="sub">'+b+'</p>'}
function tile(i,n,d,p){return '<button class="tile" data-page="'+p+'"><div class="ico">'+i+'</div><h3>'+n+'</h3><p>'+d+'</p></button>'}
function post(p,i){return '<article class="card"><div class="row"><span class="avatar">'+esc(p.name.charAt(0))+'</span><div><b>'+esc(p.name)+'</b><div class="muted tiny">@creator · just now</div></div><button class="btn" style="margin-left:auto" data-action="more">•••</button></div><p>'+esc(p.text)+'</p><div class="muted">'+esc(p.tag)+'</div><div class="postmedia">'+p.emoji+'</div><div class="actions"><button data-action="like" data-i="'+i+'">'+(state.liked[i]?'💜':'♡')+' '+(p.likes+(state.liked[i]?1:0))+' Like</button><button data-action="comment">▢ Comment</button><button data-action="save" data-i="'+i+'">'+(state.saved[i]?'🔖 Saved':'♧ Save')+'</button><button data-action="share">↗ Share</button></div></article>'}
function home(){return heading('Your world, your people.','Connect, create and discover what inspires you.')+'<div class="stories">'+[['＋','Your story'],['M','Mira'],['J','Jay'],['A','Amara'],['T','Tobi']].map(function(x){return '<div class="story"><div class="avatar">'+x[0]+'</div>'+x[1]+'</div>'}).join('')+'</div><div class="card composer"><span class="avatar">H</span><input id="postText" placeholder="What is happening in your world?"><button class="btn primary" data-action="post">Post</button></div>'+state.posts.map(post).join('')+'<div class="grid">'+tile('✦','AI Studio','Creative AI tools','AI Studio')+tile('🛍️','Marketplace','Shop and send gifts','Marketplace')+'</div>'}
function discover(){return heading('Discover','Find creators, communities and new ideas.')+'<div class="grid">'+tile('🎨','Creators','Discover people making things','Profile')+tile('👥','Groups','Join conversations','Groups')+tile('📅','Events','What is happening','Events')+tile('🔥','Trending','Popular community posts','Home')+'</div><div class="card"><h3>People you may like</h3><div class="row"><span class="avatar">M</span><div><b>Mira James</b><div class="muted tiny">Artist · 2.4k followers</div></div><button class="btn primary" style="margin-left:auto" data-action="follow">'+(state.following?'Following':'Follow')+'</button></div></div>'}
function market(){return heading('Marketplace & Gifts','Switch between shopping and sending a little love.')+'<div class="tabs"><button class="tab '+(state.market==='Marketplace'?'active':'')+'" data-market="Marketplace">🛍️ Marketplace</button><button class="tab '+(state.market==='Gifts'?'active':'')+'" data-market="Gifts">🎁 Gifts</button></div>'+(state.market==='Marketplace'?'<div class="grid">'+tile('👕','Creator merch','Explore creator products','Premium')+tile('🎨','Digital designs','Creative downloads','AI Studio')+tile('🎧','Music & audio','Discover sounds','Discover')+tile('🧵','Fashion','Style from the community','Discover')+'</div>':'<div class="grid">'+tile('🌹','Rose','Send a thank-you','Premium')+tile('💎','Diamond','Celebrate a creator','Premium')+tile('🎉','Celebration','Make their day','Premium')+tile('💌','Love note','Send a personal message','Messages')+'</div>')+'<div class="notice">Checkout and gift delivery are previews until payment and database services are connected.</div>'}
function chatPage(){return heading(state.page,'Your conversations and AI guide.')+'<div class="card"><div class="chatlog" id="chatlog">'+state.messages.map(function(m){return '<div class="bubble '+(m.who==='You'?'me':'')+'"><b>'+esc(m.who)+'</b><br>'+esc(m.text)+'</div>'}).join('')+'</div><form id="chatform" class="chatform"><input class="field" id="chatinput" placeholder="'+(state.page==='Messages'?'Write a message...':'Ask the AI Guide...')+'" required><button class="btn primary">Send</button></form><p class="muted tiny">Demo only: real-time messages and AI responses require service integrations.</p></div>'}
function profile(){return heading('Your profile','Your identity, work and memories in one place.')+'<div class="card" style="padding:0;overflow:hidden"><div class="cover"></div><div class="profilehead"><div class="row"><span class="avatar">H</span><button class="btn" style="margin-left:auto" data-page="Settings">Edit profile</button></div><h2>'+esc(state.name)+'</h2><div class="muted">@hellcampuser · Creator</div><p>Sharing ideas, building community and creating something new. ✨</p><p><b>120</b> <span class="muted">followers</span>　<b>84</b> <span class="muted">following</span></p><div class="tabs"><button class="tab" data-page="Saved">Saved</button><button class="tab" data-page="Memories">Memories</button><button class="tab" data-page="Events">Events</button></div></div></div>'+state.posts.map(post).join('')}
function ai(){return heading('AI Studio','Your creative toolbox. These are previews until AI services are connected.')+'<div class="grid">'+tile('✦','AI Chat','Ask questions and brainstorm','AI Chat')+tile('🎓','Educational Studio','Create learning designs','Educational Studio')+tile('🪄','AI Head Swap','Image workflow preview','AI Head Swap')+tile('🎙️','AI Voice','Voice and narration preview','AI Voice')+'</div>'+chatBox()}
function chatBox(){return '<div class="card"><h3>AI Guide</h3><div class="chatlog" id="chatlog">'+state.messages.map(function(m){return '<div class="bubble '+(m.who==='You'?'me':'')+'"><b>'+esc(m.who)+'</b><br>'+esc(m.text)+'</div>'}).join('')+'</div><form id="chatform" class="chatform"><input class="field" id="chatinput" placeholder="Ask the AI Guide..." required><button class="btn primary">Send</button></form></div>'}
function premium(){return heading('Hell Camp Premium','More ways to create, connect and grow.')+'<div class="grid">'+tile('🌱','Silver','Community essentials','Profile')+tile('✨','Gold','Creator tools preview','AI Studio')+tile('💎','Diamond','Expanded creator experience','AI Studio')+tile('👑','Platinum','Premium access preview','AI Studio')+'</div><div class="notice">Subscriptions, prices and coin balances are not active until billing is integrated.</div>'}
function settings(){return heading('Settings & Privacy','Manage your account preferences.')+'<div class="card"><h3>Profile & account</h3><label class="muted tiny">Display name</label><input class="field" id="nameinput" value="'+esc(state.name)+'"><button class="btn primary" data-action="savename">Save display name</button></div><div class="card"><h3>Appearance</h3><button class="btn" data-action="theme">Toggle light / dark theme</button></div><div class="card"><h3>Privacy and security</h3><p class="muted">Visibility, two-factor authentication, sessions and account recovery require secure authentication integration.</p></div>'}
function admin(){return heading('ADMINhub','Administration interface preview.')+'<div class="notice">This is not a secure admin system. Do not use it to manage real users, payments or credits until server-side permissions and audit logs are connected.</div><div class="grid">'+tile('👥','User management','Account tools preview','Settings')+tile('💳','Payments','Payment activity preview','Premium')+tile('🔔','Notifications','Notification area','Notifications')+tile('📊','Analytics','Platform insights preview','Creator Studio')+'</div>'}
function generic(p){var map={'Groups':['👥','Community groups and conversations.'],'Events':['📅','Create and discover community events.'],'Creator Studio':['🎬','Manage creator content and performance.'],'Ads Center':['📣','Campaign planning preview.'],'Help & Support':['❔','Help articles and support contact.'],'Notifications':['🔔','Alerts will appear here when notifications are connected.'],'Saved':['🔖','Your saved posts.'],'Memories':['🌄','Keep meaningful moments close.'],'Login':['🔐','Secure sign-in, sign-up and password recovery will be connected.'],'AI Chat':['✦','Chat with an AI assistant.'],'Educational Studio':['🎓','Plan learning materials and educational designs.'],'AI Head Swap':['🪄','Preview the image transformation workflow.'],'AI Voice':['🎙️','Preview voice generation and narration.']};var x=map[p]||['✦','This area is part of the Hell Camp foundation.'];return heading(p,x[1])+'<div class="card" style="text-align:center;padding:35px 15px"><div style="font-size:40px">'+x[0]+'</div><h3>'+p+'</h3><p class="muted">This section will connect to real data and services in a later stage.</p><button class="btn primary" data-page="Home">Back to Home</button></div>'}
function render(){document.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===state.page)});var funcs={Home:home,Discover:discover,Messages:chatPage,Marketplace:market,'AI Studio':ai,Profile:profile,Premium:premium,Settings:settings,ADMINhub:admin};view.innerHTML=(funcs[state.page]||function(){return generic(state.page)})();document.title=state.page+' — Hell Camp'}
document.addEventListener('click',function(e){var p=e.target.closest('[data-page]');if(p){state.page=p.dataset.page;render();window.scrollTo(0,0);return}var m=e.target.closest('[data-market]');if(m){state.market=m.dataset.market;render();return}var b=e.target.closest('[data-action]');if(!b)return;var i=b.dataset.i;switch(b.dataset.action){case'theme':document.body.classList.toggle('light');break;case'like':state.liked[i]=!state.liked[i];render();break;case'save':state.saved[i]=!state.saved[i];render();break;case'comment':alert('Comments will be enabled after backend integration.');break;case'share':alert('Share features will be connected in a later stage.');break;case'more':alert('Post options preview.');break;case'follow':state.following=!state.following;render();break;case'savename':var n=document.getElementById('nameinput');if(n&&n.value.trim())state.name=n.value.trim();render();break;case'post':var input=document.getElementById('postText');if(input&&input.value.trim()){state.posts.unshift({name:state.name,text:input.value.trim(),tag:'#HellCamp',emoji:'✨',likes:0});render()}else alert('Write something before posting.');break}});
document.addEventListener('submit',function(e){if(e.target.id!=='chatform')return;e.preventDefault();var input=document.getElementById('chatinput');var t=input.value.trim();if(!t)return;state.messages.push({who:'You',text:t});state.messages.push({who:state.page==='Messages'?'Mira (demo)':'AI Guide',text:state.page==='Messages'?'This is a demo conversation. Connect messaging services to send real messages.':'I can help you plan content, explore Hell Camp features, and brainstorm creative ideas. Live AI responses will be available after an AI service is connected.'});render();var log=document.getElementById('chatlog');if(log)log.scrollTop=log.scrollHeight});
document.getElementById('search').addEventListener('keydown',function(e){if(e.key==='Enter'&&this.value.trim()){state.page='Discover';render();var sub=view.querySelector('.sub');if(sub)sub.textContent='Search preview: '+this.value.trim()+' — connect search to find real accounts and posts.'}});
render();
})();
</script></body></html>
