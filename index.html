async function loadLibraryCatalog(reset){
 var host=document.getElementById('libraryBooks');if(!host)return;
 if(!window.hcLibrary)window.hcLibrary={page:1,books:[],next:'https://gutendex.com/books/?topic=fiction',query:'',busy:false};
 var lib=window.hcLibrary;
 if(reset){lib.page=1;lib.books=[];lib.next='https://gutendex.com/books/?topic=fiction';lib.query=(document.getElementById('librarySearch')||{}).value||'';}
 if(lib.busy)return;lib.busy=true;
 var more=document.getElementById('libraryMore');if(more){more.disabled=true;more.textContent='Loading…';}
 try{
  var url=lib.query?'https://gutendex.com/books/?search='+encodeURIComponent(lib.query)+'&page='+lib.page:lib.next;
  if(!url){if(more)more.style.display='none';return;}
  var response=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('Catalogue temporarily unavailable');
  var data=await response.json(),items=(data.results||[]).filter(function(b){return b.formats&&Object.keys(b.formats).some(function(f){return f.indexOf('text/html')===0;});});
  var seen={};lib.books.forEach(function(b){seen[b.id]=1;});items.forEach(function(b){if(!seen[b.id]&&lib.books.length<1000){lib.books.push(b);seen[b.id]=1;}});
  lib.next=data.next||null;lib.page++;
  host.innerHTML=lib.books.length?lib.books.map(libraryBookCard).join(''):'<div class="card">No readable books found for that search. Try another title or author.</div>';
  var count=document.getElementById('libraryCount');if(count)count.textContent=lib.books.length+' readable public-domain titles loaded'+(lib.books.length>=1000?' · catalogue limit reached':'');
  if(more){more.style.display=lib.books.length>=1000||(!lib.next&&!lib.query)?'none':'';more.disabled=false;more.textContent='Load more books';}
 }catch(err){host.innerHTML=lib.books.length?lib.books.map(libraryBookCard).join(''):'<div class="card"><p>We could not reach the free book catalogue right now. Please try again shortly.</p><a href="https://www.gutenberg.org/ebooks/" target="_blank" rel="noopener noreferrer">Browse Project Gutenberg ↗</a></div>';if(more){more.disabled=false;more.textContent='Try loading books again';}console.warn('Library catalogue:',err.message);}
 finally{lib.busy=false;}
}

async function acceptMessageRequest(id,uid,name){var r=await supabaseClient.from('message_requests').update({status:'accepted',updated_at:new Date().toISOString()}).eq('id',id);if(r.error){alert(r.error.message);return;}var c=await supabaseClient.from('conversations').insert({created_by:authUser.id,title:String(name||'Direct message').slice(0,120),is_group:false}).select('id').single();if(c.error){alert('Request accepted, but chat creation failed: '+c.error.message);await loadMessageRequests();return;}var m=await supabaseClient.from('conversation_members').insert([{conversation_id:c.data.id,user_id:authUser.id},{conversation_id:c.data.id,user_id:uid}]);if(m.error){alert('Request accepted, but chat setup failed: '+m.error.message);return;}state.currentConversationId=c.data.id;state.page='Messages';render()}
async function uploadChatMedia(file,type,duration){if(!file||!state.currentConversationId||!authUser)return;if(file.size>15*1024*1024){alert('Files must be 15 MB or smaller.');return;}var ext=(file.name&&file.name.split('.').pop()||(type==='image'?'jpg':'webm')).replace(/[^a-zA-Z0-9]/g,'').slice(0,8)||'bin',path=state.currentConversationId+'/'+authUser.id+'/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;var up=await supabaseClient.storage.from('chat-media').upload(path,file,{contentType:file.type||(type==='image'?'image/jpeg':'audio/webm'),upsert:false});if(up.error){alert('Upload failed: '+up.error.message);return;}var ins=await supabaseClient.from('direct_messages').insert({conversation_id:state.currentConversationId,sender_id:authUser.id,body:type==='image'?'Photo':'Voice note',media_url:path,media_type:type,media_duration_seconds:duration||null});if(ins.error){alert('Media uploaded but message failed: '+ins.error.message);return;}await loadDirectMessages()}

(function(){
  function applyTheme(preference, persist){
    var pref = ['light','dark','system'].indexOf(preference) >= 0 ? preference : 'system';
    var light = pref === 'light' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
    document.body.classList.toggle('light', !!light);
    document.documentElement.style.colorScheme = light ? 'light' : 'dark';
    if (persist) { try { localStorage.setItem('hc_theme_preference', pref); } catch (e) {} }
  }
  window.hcApplyThemePreference = applyTheme;
  var saved = null;
  try { saved = localStorage.getItem('hc_theme_preference'); } catch (e) {}
  var initialSelect = document.getElementById('pref_theme');
  applyTheme(saved || (initialSelect && initialSelect.value) || 'system', false);
  /* Handle the visible theme toggle before older delegated handlers can conflict. */
  document.addEventListener('click', function(e){
    var target = e.target && e.target.closest ? e.target.closest('[data-action="theme"], [data-action="toggleTheme"], [data-theme-toggle]') : null;
    if (!target) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var next = document.body.classList.contains('light') ? 'dark' : 'light';
    applyTheme(next, true);
    var select = document.getElementById('pref_theme');
    if (select) select.value = next;
  }, true);
  document.addEventListener('change', function(e){
    if (e.target && e.target.id === 'pref_theme') applyTheme(e.target.value, true);
  });
  document.addEventListener('submit', function(e){
    if (e.target && e.target.id === 'memberSettingsForm') {
      var select = document.getElementById('pref_theme');
      if (select) applyTheme(select.value, true);
    }
  }, true);
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: light)');
    var syncSystemTheme = function(){
      var pref = 'system';
      var select = document.getElementById('pref_theme');
      try { pref = localStorage.getItem('hc_theme_preference') || (select && select.value) || 'system'; } catch (e) {}
      if (pref === 'system') applyTheme('system', false);
    };
    if (mq.addEventListener) mq.addEventListener('change', syncSystemTheme);
    else if (mq.addListener) mq.addListener(syncSystemTheme);
  }
})();
</script>
