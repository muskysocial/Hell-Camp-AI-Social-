 if(lib.busy)return;lib.busy=true;
 var more=document.getElementById('libraryMore');if(more){more.disabled=true;more.textContent='Loading…';}
 try{
  var url=lib.query?'https://gutendex.com/books/?search='+encodeURIComponent(lib.query)+'&page='+lib.page:lib.next;
  if(!url){if(more)more.style.display='none';return;}
  var response=await fetch(url,{headers:{'Accept':'application/json'}});

  var seen={};lib.books.forEach(function(b){seen[b.id]=1;});items.forEach(function(b){if(!seen[b.id]&&lib.books.length<1000){lib.books.push(b);seen[b.id]=1;}});

  var count=document.getElementById('libraryCount');if(count)count.textContent=lib.books.length+' readable public-domain titles loaded'+(lib.books.length>=1000?' · catalogue limit reached':'');
  if(more){more.style.display=lib.books.length>=1000||(!lib.next&&!lib.query)?'none':'';more.disabled=false;more.textContent='Load more books';}
 }catch(err){host.innerHTML=lib.books.length?lib.books.map(libraryBookCard).join(''):'<div class="card"><p>We could not reach the free book catalogue right now. Please try again shortly.</p><a href="https://www.gutenberg.org/ebooks/" target="_blank" rel="noopener noreferrer">Browse Project Gutenberg ↗</a></div>';if(more){more.disabled=false;more.textContent='Try loading books again';}console.warn('Library catalogue:',err.message);}
 finally{lib.busy=false;}
}

async function loadConversations(){var h=document.getElementById('conversationList');if(!h||state.page!=='Messages'||state.currentConversationId)return;if(!authUser){h.innerHTML='<div class="card">Sign in to use messaging.</div>';return;}var m=await supabaseClient.from('conversation_members').select('conversation_id').eq('user_id',authUser.id);if(m.error){h.innerHTML='<div class="card">'+esc(m.error.message)+'</div>';return;}var ids=(m.data||[]).map(x=>x.conversation_id);if(!ids.length){h.innerHTML='<div class="card muted">No conversations yet. Find a member above and tap Message.</div>';return;}var r=await supabaseClient.from('conversations').select('id,title,is_group,created_at').in('id',ids).order('created_at',{ascending:false});if(r.error){h.innerHTML='<div class="card">'+esc(r.error.message)+'</div>';return;}var last=await supabaseClient.from('direct_messages').select('conversation_id,body,created_at').in('conversation_id',ids).order('created_at',{ascending:false}).limit(200),preview={};if(!last.error)(last.data||[]).forEach(x=>{if(!preview[x.conversation_id])preview[x.conversation_id]=x.body});h.innerHTML=(r.data||[]).map(c=>'<button class="chat-row" style="width:100%;text-align:left;background:transparent;border:0;color:inherit" data-action="openConversation" data-id="'+c.id+'"><span class="avatar">✉️</span><span class="chat-info"><b>'+esc(c.title||'Direct conversation')+'</b><p>'+esc(preview[c.id]||'No messages yet')+'</p></span>Open ›</button>').join('')||'<div class="card muted">No conversations yet.</div>'}
async function loadDirectMessages(){var h=document.getElementById('directChatLog');if(!h||!state.currentConversationId)return;var r=await supabaseClient.from('direct_messages').select('id,sender_id,body,created_at').eq('conversation_id',state.currentConversationId).order('created_at').limit(300);if(!document.getElementById('directChatLog'))return;if(r.error){h.textContent='Could not load messages: '+r.error.message;return;}var ids=[...new Set((r.data||[]).map(x=>x.sender_id))],names={};if(ids.length){var nr=await supabaseClient.from('member_directory').select('user_id,display_name').in('user_id',ids);if(!nr.error)(nr.data||[]).forEach(x=>names[x.user_id]=x.display_name)}h.innerHTML=(r.data||[]).map(x=>'<div class="bubble '+(x.sender_id===authUser.id?'me':'')+'"><b>'+esc(x.sender_id===authUser.id?'You':names[x.sender_id]||'Member')+'</b><br>'+esc(x.body)+'<div class="tiny muted">'+esc(new Date(x.created_at).toLocaleString())+'</div></div>').join('')||'<p class="muted">No messages yet. Say hello!</p>';h.scrollTop=h.scrollHeight}
async function startConversation(uid,name){var m=await supabaseClient.from('conversation_members').select('conversation_id').eq('user_id',authUser.id);if(!m.error&&m.data.length){var ids=m.data.map(x=>x.conversation_id),r=await supabaseClient.from('conversations').select('id,title').in('id',ids).eq('title',name).eq('is_group',false).limit(1);if(!r.error&&r.data.length){state.currentConversationId=r.data[0].id;render();return}}var c=await supabaseClient.from('conversations').insert({created_by:authUser.id,title:String(name).slice(0,120),is_group:false}).select('id').single();if(c.error){alert('Could not start conversation: '+c.error.message);return}var own=await supabaseClient.from('conversation_members').insert({conversation_id:c.data.id,user_id:authUser.id});if(own.error){alert(own.error.message);return}var other=await supabaseClient.from('conversation_members').insert({conversation_id:c.data.id,user_id:uid});if(other.error){alert('Conversation started, but member could not be added: '+other.error.message);return}state.currentConversationId=c.data.id;render()}
